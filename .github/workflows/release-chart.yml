name: Release Charts & Docker Version Tag

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine chart version
        if: steps.cr.outputs.changed_charts != ''
        id: version
        run: |
          VERSION=$(grep '^version:' charts/cert-manager-webhook-ionos/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup QEMU
        if: steps.cr.outputs.changed_charts != ''
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: steps.cr.outputs.changed_charts != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.cr.outputs.changed_charts != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push immutable version tag
        if: steps.cr.outputs.changed_charts != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ github.repository }}:${{ steps.version.outputs.value }}
